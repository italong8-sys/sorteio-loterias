name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Capacitor CLI
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Inicializar Projeto Capacitor
        run: |
          npx cap init "Sorteio Virtual" "com.italo.sorteioloterias" --web-dir public

      - name: Adicionar Plataforma Android e Gerar APK
        run: |
          npx cap add android
          npx cap copy android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: SorteioVirtual-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
