name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Instalar Dependências do Projeto
        run: npm install

      - name: Inicializar Capacitor e Plataforma Android
        run: |
          npx cap init "Sorteio Virtual" "com.italo.sorteioloterias" --web-dir public
          npx cap add android
          npx cap copy android

      - name: Compilar APK Android
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: SorteioVirtual-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
